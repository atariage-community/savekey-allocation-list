name: Validate allocation list

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate.py allocations.yaml
      - run: python tools/generate.py allocations.yaml /tmp/ALLOCATIONS.md
      - name: Check generated allocation table
        run: diff -u ALLOCATIONS.md /tmp/ALLOCATIONS.md
